<ng-template #buttonContent>
  <div class="button-content-wrapper">
    @if (loading) {
    <mat-progress-spinner
      mode="indeterminate"
      diameter="24"
    ></mat-progress-spinner>
    } @else {
    <!-- 
        Lógica atualizada: Verifica o ícone e o texto independentemente.
        Ambos podem ser renderizados juntos agora.
      -->
    @if (icon) {
    <mat-icon>{{ icon }}</mat-icon>
    } @if (text) {
    <span>{{ text }}</span>
    } }
  </div>
</ng-template>

@switch (buttonStyle) { @case ('raised') {
<button
  mat-raised-button
  [color]="color"
  [type]="type"
  [disabled]="disabled || loading"
  (click)="onClick()"
>
  <ng-container *ngTemplateOutlet="buttonContent"></ng-container>
</button>
} @case ('basic') {
<button
  mat-button
  [color]="color"
  [type]="type"
  [disabled]="disabled || loading"
  (click)="onClick()"
>
  <ng-container *ngTemplateOutlet="buttonContent"></ng-container>
</button>
} @case ('stroked') {
<button
  mat-stroked-button
  [color]="color"
  [type]="type"
  [disabled]="disabled || loading"
  (click)="onClick()"
>
  <ng-container *ngTemplateOutlet="buttonContent"></ng-container>
</button>
} @case ('flat') {
<button
  mat-flat-button
  [color]="color"
  [type]="type"
  [disabled]="disabled || loading"
  (click)="onClick()"
>
  <ng-container *ngTemplateOutlet="buttonContent"></ng-container>
</button>
} @case ('icon') {
<button
  mat-icon-button
  [color]="color"
  [type]="type"
  [disabled]="disabled || loading"
  (click)="onClick()"
>
  <ng-container *ngTemplateOutlet="buttonContent"></ng-container>
</button>
} @case ('fab') {
<button
  mat-fab
  [color]="color"
  [type]="type"
  [disabled]="disabled || loading"
  (click)="onClick()"
>
  <ng-container *ngTemplateOutlet="buttonContent"></ng-container>
</button>
} @case ('mini-fab') {
<button
  mat-mini-fab
  [color]="color"
  [type]="type"
  [disabled]="disabled || loading"
  (click)="onClick()"
>
  <ng-container *ngTemplateOutlet="buttonContent"></ng-container>
</button>
} }
