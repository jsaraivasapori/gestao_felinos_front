<div class="d-flex flex-column">
  <mat-slide-toggle [formControl]="control" [color]="color">
    {{ label }}
  </mat-slide-toggle>

  @if (control.invalid && (control.dirty || control.touched)) { @if
  (control.hasError('requiredTrue')) {
  <mat-error class="mat-body-small">Este campo é obrigatório.</mat-error>
  } }
</div>
