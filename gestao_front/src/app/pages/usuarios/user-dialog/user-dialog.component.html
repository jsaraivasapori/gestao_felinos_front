@if (isEditMode) {
<h2 mat-dialog-title>Editando Usuario</h2>
}@else {
<h2 mat-dialog-title>Inserindo Usario</h2>
}
<mat-dialog-content>
  <app-dynamic-form
    [formConfig]="formConfig"
    [initialData]="initialData"
    [submitLabel]="isEditMode ? 'Atualizar' : 'Adicionar'"
    (formSubmitted)="onFormSubmitted($event)"
    (cancel)="onCancel()"
  >
  </app-dynamic-form>
</mat-dialog-content>
