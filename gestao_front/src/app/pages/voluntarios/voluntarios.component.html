@if(!isFormRoute){
<div class="border border-lihgt mb-4">
  <p class="page-title">Gestão de Voluntários</p>

  <div class="mb-3 d-flex justify-content-between align-items-stretch">
    <div class="w-25 p-3 mt-2">
      <button
        mat-button
        mat-raised-button
        color="primary"
        class="button-font-size button-max-width"
        (click)="addNewVolunteer()"
      >
        Novo Voluntário
      </button>
    </div>

    <mat-form-field class="p-3 w-25">
      <mat-label>Busca rápida</mat-label>
      <input
        matInput
        placeholder="Ex. João"
        #filterInput
        (keyup)="handleFilterInput()"
      />
    </mat-form-field>
  </div>
</div>
<app-card
  title="Informações gerais sobre os voluntários"
  subtitle="Use os icones para interagir com as linhas"
>
  <div class="pb-3 px-3 mt-2">
    <app-table-re-orderable-columns
      [dataSource]="(voluntarioReceiver$ | async) || []"
      [filterValue]="currentFilter"
      [columnsToDisplay]="['nome', 'telefone', 'turno', 'action']"
      [columnHeaders]="{
        nome: 'Nome',
        telefone: 'Telefone',
        turno: 'Turno',
        action: 'Ações'
      }"
      (editElement)="toEditVolunteero($event)"
      (deleteElement)="toDeleteVolunteer($event.id)"
    >
    </app-table-re-orderable-columns>
  </div>
</app-card>

}@else {<router-outlet></router-outlet>}
