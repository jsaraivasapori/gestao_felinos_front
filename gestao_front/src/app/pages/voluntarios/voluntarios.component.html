<h1>Gestão de Voluntários</h1>
@if(!isFormRoute){
<div class="container-fluid">
  <div class="w-25 p-3">
    <button mat-button mat-raised-button color="primary">Novo Felino</button>
  </div>
</div>
<app-table-re-orderable-columns
  [dataSource]="data"
  [columnsToDisplay]="['nome', 'idade', 'bairro', 'action']"
  [columnHeaders]="{
    nome: 'Nome',
    idade: 'Idade',
    bairro: 'Bairro',
    action: 'Ações'
  }"
  (editElement)="toEditVolunteero($event)"
  (deleteElement)="toDeleteVolunteer($event)"
></app-table-re-orderable-columns>

}@else {<router-outlet></router-outlet>}
